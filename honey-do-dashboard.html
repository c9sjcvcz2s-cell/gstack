<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Do Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3348;
    --text: #e8eaf0;
    --muted: #7b82a0;
    --urgent: #ff5f72;
    --urgent-bg: #2a1420;
    --week: #f5a623;
    --week-bg: #2a2010;
    --someday: #4a9eff;
    --someday-bg: #101d2a;
    --done: #52d48c;
    --done-bg: #0f2a1d;
    --accent: #6c63ff;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 16px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .panel-full { grid-column: 1 / -1; }
  .panel-half { grid-column: span 2; }

  /* Panel headers */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .panel-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-urgent { background: var(--urgent); }
  .dot-week   { background: var(--week); }
  .dot-someday { background: var(--someday); }
  .dot-done   { background: var(--done); }
  .dot-notes  { background: var(--accent); }
  .dot-cal    { background: #c084fc; }

  /* Add task input */
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.85rem;
    padding: 7px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--muted); }
  .add-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    padding: 7px 14px;
    transition: opacity 0.15s;
  }
  .add-btn:hover { opacity: 0.85; }

  /* Task list */
  .task-list { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    cursor: default;
    transition: background 0.1s;
    user-select: none;
  }
  .task-item:hover { background: #272b40; }
  .task-item.done { opacity: 0.45; }
  .task-cb {
    width: 17px; height: 17px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .task-cb:hover { border-color: var(--done); }
  .task-cb.checked { background: var(--done); border-color: var(--done); }
  .task-cb.checked::after { content: '✓'; color: #0f2a1d; font-size: 10px; font-weight: 800; }
  .task-text {
    flex: 1;
    font-size: 0.875rem;
    line-height: 1.4;
  }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-delete {
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 2px 5px;
    border-radius: 4px;
    transition: background 0.1s, color 0.1s;
    opacity: 0;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: var(--urgent-bg); color: var(--urgent); }

  /* Move buttons */
  .task-move {
    color: var(--muted);
    cursor: pointer;
    font-size: 0.7rem;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.1s, background 0.1s;
    white-space: nowrap;
  }
  .task-item:hover .task-move { opacity: 1; }
  .task-move:hover { background: var(--surface); color: var(--text); }

  /* Empty state */
  .empty { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 12px 0; }

  /* Notes */
  .notes-area {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.875rem;
    line-height: 1.6;
    min-height: 120px;
    padding: 10px 12px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }
  .notes-area:focus { border-color: var(--accent); }
  .notes-area::placeholder { color: var(--muted); }

  /* Calendar */
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cal-nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 4px 10px;
    transition: background 0.1s;
  }
  .cal-nav-btn:hover { background: var(--border); }
  .cal-month-label { font-size: 0.9rem; font-weight: 600; min-width: 130px; text-align: center; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 14px;
  }
  .cal-day-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    padding: 4px 0;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    transition: background 0.1s, border-color 0.1s;
    position: relative;
  }
  .cal-day:hover:not(.empty-day) { background: var(--border); border-color: var(--accent); }
  .cal-day.today { border-color: var(--accent); font-weight: 700; color: var(--accent); }
  .cal-day.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal-day.empty-day { background: transparent; border: none; cursor: default; }
  .cal-day.has-task::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--urgent);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px;
    text-align: center;
    flex: 1;
    min-width: 80px;
  }
  .stat-num { font-size: 1.6rem; font-weight: 800; }
  .stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-urgent .stat-num { color: var(--urgent); }
  .stat-week .stat-num   { color: var(--week); }
  .stat-someday .stat-num { color: var(--someday); }
  .stat-done .stat-num   { color: var(--done); }

  /* Section label tags for urgent/week/someday */
  .bucket-urgent  { border-left: 3px solid var(--urgent); }
  .bucket-week    { border-left: 3px solid var(--week); }
  .bucket-someday { border-left: 3px solid var(--someday); }

  /* Progress bar */
  .progress-wrap { margin-bottom: 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .progress-bar { background: var(--surface2); border-radius: 99px; height: 7px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, var(--done), #38d9a9); height: 100%; border-radius: 99px; transition: width 0.4s ease; }

  /* Responsive */
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .panel-half { grid-column: span 2; }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .panel-half, .panel-full { grid-column: 1; }
    body { padding: 14px; }
  }
</style>
</head>
<body>

<h1>Honey Do Dashboard</h1>
<p class="subtitle" id="date-label">Loading...</p>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-chip stat-urgent">
    <div class="stat-num" id="stat-urgent">0</div>
    <div class="stat-label">Urgent</div>
  </div>
  <div class="stat-chip stat-week">
    <div class="stat-num" id="stat-week">0</div>
    <div class="stat-label">This Week</div>
  </div>
  <div class="stat-chip stat-someday">
    <div class="stat-num" id="stat-someday">0</div>
    <div class="stat-label">Someday</div>
  </div>
  <div class="stat-chip stat-done">
    <div class="stat-num" id="stat-done">0</div>
    <div class="stat-label">Done</div>
  </div>
</div>

<!-- Progress -->
<div class="progress-wrap">
  <div class="progress-label">
    <span>Overall Progress</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<!-- Main grid -->
<div class="grid">

  <!-- Urgent -->
  <div class="panel bucket-urgent">
    <div class="panel-header">
      <div class="panel-title"><span class="dot dot-urgent"></span> Urgent</div>
    </div>
    <div class="add-row">
      <input class="add-input" id="inp-urgent" placeholder="Add urgent task…" />
      <button class="add-btn" onclick="addTask('urgent')">+</button>
    </div>
    <div class="task-list" id="list-urgent"></div>
  </div>

  <!-- This Week -->
  <div class="panel bucket-week">
    <div class="panel-header">
      <div class="panel-title"><span class="dot dot-week"></span> This Week</div>
    </div>
    <div class="add-row">
      <input class="add-input" id="inp-week" placeholder="Add task for this week…" />
      <button class="add-btn" onclick="addTask('week')">+</button>
    </div>
    <div class="task-list" id="list-week"></div>
  </div>

  <!-- Someday -->
  <div class="panel bucket-someday">
    <div class="panel-header">
      <div class="panel-title"><span class="dot dot-someday"></span> Someday</div>
    </div>
    <div class="add-row">
      <input class="add-input" id="inp-someday" placeholder="Add future task…" />
      <button class="add-btn" onclick="addTask('someday')">+</button>
    </div>
    <div class="task-list" id="list-someday"></div>
  </div>

  <!-- Notes -->
  <div class="panel panel-half">
    <div class="panel-header">
      <div class="panel-title"><span class="dot dot-notes"></span> Notes</div>
    </div>
    <textarea class="notes-area" id="notes" placeholder="Jot down anything — materials needed, measurements, contact info…"></textarea>
  </div>

  <!-- Calendar -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title"><span class="dot dot-cal"></span> Calendar</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div class="cal-month-label" id="cal-month"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- Done -->
  <div class="panel panel-full">
    <div class="panel-header">
      <div class="panel-title"><span class="dot dot-done"></span> Completed</div>
      <button class="cal-nav-btn" onclick="clearDone()" style="font-size:0.75rem">Clear all</button>
    </div>
    <div class="task-list" id="list-done"></div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const BUCKETS = ['urgent', 'week', 'someday'];
let state = load();

function defaultState() {
  return {
    tasks: {
      urgent:  [],
      week:    [],
      someday: [],
      done:    []
    },
    notes: '',
    cal: { year: new Date().getFullYear(), month: new Date().getMonth() }
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('honey-do') || 'null');
    if (s && s.tasks) return s;
  } catch(e) {}
  return defaultState();
}

function save() {
  localStorage.setItem('honey-do', JSON.stringify(state));
}

// ── Tasks ──────────────────────────────────────────────────────────────────
function addTask(bucket) {
  const inp = document.getElementById('inp-' + bucket);
  const text = inp.value.trim();
  if (!text) return;
  state.tasks[bucket].push({ id: Date.now(), text, done: false });
  inp.value = '';
  save();
  render();
  inp.focus();
}

function toggleTask(bucket, id) {
  const task = state.tasks[bucket].find(t => t.id === id);
  if (!task) return;
  state.tasks[bucket] = state.tasks[bucket].filter(t => t.id !== id);
  task.done = true;
  state.tasks.done.unshift(task);
  save();
  render();
}

function undoneTask(id) {
  const task = state.tasks.done.find(t => t.id === id);
  if (!task) return;
  state.tasks.done = state.tasks.done.filter(t => t.id !== id);
  task.done = false;
  state.tasks.urgent.unshift(task);
  save();
  render();
}

function deleteTask(bucket, id) {
  state.tasks[bucket] = state.tasks[bucket].filter(t => t.id !== id);
  save();
  render();
}

function moveTask(fromBucket, id, toBucket) {
  const task = state.tasks[fromBucket].find(t => t.id === id);
  if (!task) return;
  state.tasks[fromBucket] = state.tasks[fromBucket].filter(t => t.id !== id);
  state.tasks[toBucket].unshift(task);
  save();
  render();
}

function clearDone() {
  if (state.tasks.done.length === 0) return;
  if (confirm('Clear all completed tasks?')) {
    state.tasks.done = [];
    save();
    render();
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
const MOVE_LABELS = { urgent: '🔴 Urgent', week: '🟡 This Week', someday: '🔵 Someday' };

function renderBucket(bucket) {
  const list = document.getElementById('list-' + bucket);
  const tasks = state.tasks[bucket];
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">Nothing here yet</div>';
    return;
  }
  list.innerHTML = tasks.map(t => {
    const moveBtns = BUCKETS.filter(b => b !== bucket).map(b =>
      `<span class="task-move" onclick="moveTask('${bucket}',${t.id},'${b}')">→ ${MOVE_LABELS[b]}</span>`
    ).join('');
    return `
      <div class="task-item" id="task-${t.id}">
        <div class="task-cb" onclick="toggleTask('${bucket}',${t.id})"></div>
        <span class="task-text">${esc(t.text)}</span>
        ${moveBtns}
        <span class="task-delete" onclick="deleteTask('${bucket}',${t.id})">✕</span>
      </div>`;
  }).join('');
}

function renderDone() {
  const list = document.getElementById('list-done');
  const tasks = state.tasks.done;
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">No completed tasks yet</div>';
    return;
  }
  list.innerHTML = tasks.map(t => `
    <div class="task-item done" id="task-${t.id}">
      <div class="task-cb checked"></div>
      <span class="task-text">${esc(t.text)}</span>
      <span class="task-move" onclick="undoneTask(${t.id})">↩ Reopen</span>
      <span class="task-delete" onclick="deleteTask('done',${t.id})">✕</span>
    </div>`).join('');
}

function renderStats() {
  const total = BUCKETS.reduce((n, b) => n + state.tasks[b].length, 0) + state.tasks.done.length;
  const done  = state.tasks.done.length;
  document.getElementById('stat-urgent').textContent  = state.tasks.urgent.length;
  document.getElementById('stat-week').textContent    = state.tasks.week.length;
  document.getElementById('stat-someday').textContent = state.tasks.someday.length;
  document.getElementById('stat-done').textContent    = done;
  const pct = total === 0 ? 0 : Math.round(done / total * 100);
  document.getElementById('progress-pct').textContent  = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function render() {
  BUCKETS.forEach(renderBucket);
  renderDone();
  renderStats();
}

// ── Notes ──────────────────────────────────────────────────────────────────
const notesEl = document.getElementById('notes');
notesEl.value = state.notes || '';
notesEl.addEventListener('input', () => {
  state.notes = notesEl.value;
  save();
});

// ── Calendar ───────────────────────────────────────────────────────────────
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function renderCal() {
  const { year, month } = state.cal;
  document.getElementById('cal-month').textContent = MONTHS[month] + ' ' + year;
  const grid = document.getElementById('cal-grid');
  const today = new Date();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let html = DAYS.map(d => `<div class="cal-day-label">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty-day"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
    html += `<div class="cal-day${isToday ? ' today' : ''}" title="${MONTHS[month]} ${d}">${d}</div>`;
  }
  grid.innerHTML = html;
}

function changeMonth(dir) {
  let { year, month } = state.cal;
  month += dir;
  if (month < 0)  { month = 11; year--; }
  if (month > 11) { month = 0;  year++; }
  state.cal = { year, month };
  save();
  renderCal();
}

// ── Enter key for inputs ───────────────────────────────────────────────────
BUCKETS.forEach(b => {
  document.getElementById('inp-' + b).addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask(b);
  });
});

// ── Date label ─────────────────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const now = new Date();
document.getElementById('date-label').textContent =
  now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

// ── Init ───────────────────────────────────────────────────────────────────
render();
renderCal();
</script>
</body>
</html>
